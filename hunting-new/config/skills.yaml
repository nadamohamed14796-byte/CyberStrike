signals:
  graphql_detected:
    skills: [attack-graphql]
  websocket_detected:
    skills: [attack-websocket]
  jwt_detected:
    skills: [attack-jwt]
  object_identifier_detected:
    skills: [attack-idor-automation]
  tenant_identifier_detected:
    skills: [api-authorization-and-bola, attack-idor-automation]
  file_upload_detected:
    skills: [hunt-file-upload]
  redirect_parameter_detected:
    skills: [hunt-open-redirect, hunt-oauth]
  waf_signal_detected:
    skills: [waf-xss-bypass]
  source_map_detected:
    skills: [javascript_intelligence]
  parameter_discovered:
    skills: [api-recon-and-docs, attack-idor-automation]
  graphql_and_authorization_anomaly:
    skills: [attack-graphql, attack-idor-automation]

skills:
  attack-idor-automation:
    agent: web-application
    confidence_threshold: 0.70
    required_signals: [authenticated_endpoint, object_identifier]
    optional_signals: [multiple_accounts, tenant_identifier]
    dependencies: [api-recon-and-docs]
    maximum_parallel_tasks: 2
  javascript_intelligence:
    agent: proxy-analyzer
    confidence_threshold: 0.50
    required_signals: [source_map_detected]
    dependencies: []
    maximum_parallel_tasks: 2
  waf-xss-bypass:
    agent: web-application
    confidence_threshold: 0.60
    required_signals: [waf_signal_detected]
    dependencies: []
    maximum_parallel_tasks: 1
