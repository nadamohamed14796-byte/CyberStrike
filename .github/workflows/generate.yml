name: generate

on:
  push:
    branches:
      - main

concurrency:
  group: generate-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        continue-on-error: true
        uses: ./.github/actions/setup-git-committer
        with:
          cyberstrike-app-id: ${{ vars.CYBERSTRIKE_APP_ID }}
          cyberstrike-app-secret: ${{ secrets.CYBERSTRIKE_APP_SECRET }}

      - name: Fallback git config
        if: steps.committer.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate
        run: ./script/generate.ts

      - name: Generate skill registry
        run: bun run --cwd packages/cyberstrike skills:registry

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main --no-verify; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
          # if ! git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }} --no-verify; then
