name: hunting-layer
on:
  push:
    branches: ["main", "feat/hunting-intelligence-layer"]
    paths:
      - "hunting-new/**"
      - "packages/cyberstrike/src/server/routes/session.ts"
      - "packages/cyberstrike/src/tool/task.ts"
      - "packages/cyberstrike/src/agent/agent.ts"
      - ".github/workflows/hunting-layer.yml"
  pull_request:
    paths:
      - "hunting-new/**"
      - "packages/cyberstrike/src/server/routes/session.ts"
      - "packages/cyberstrike/src/tool/task.ts"
      - "packages/cyberstrike/src/agent/agent.ts"
      - ".github/workflows/hunting-layer.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Static runtime preflight
        working-directory: hunting-new
        run: python3 runtime_preflight.py --static
      - name: Test hunting layer
        working-directory: hunting-new
        run: bun test
      - name: Typecheck hunting layer
        working-directory: hunting-new
        run: bunx tsc --noEmit
