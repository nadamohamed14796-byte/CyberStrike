name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@cyberstrike.io"
          git config --global user.name "cyberstrike"

      - name: Verify CLI help
        run: bun run --cwd packages/cyberstrike src/index.ts -h

      - name: Run research ingestion regression tests
        run: bun run --cwd packages/cyberstrike test test/research/safe-fetch.test.ts test/research/learning-pipeline.test.ts test/learning/source-fingerprint.test.ts test/learning/report-knowledge-fingerprint.test.ts test/learning/tool-learning.test.ts

      - name: Typecheck CyberStrike package
        run: bun run --cwd packages/cyberstrike typecheck

      - name: Run unit tests
        run: bun turbo test

      # Run even when the workspace suite fails so package build health remains visible.
      # Use the repository fixture rather than fetching live models.dev data.
      - name: Build CyberStrike native Linux binary
        if: always()
        env:
          MODELS_DEV_API_JSON: test/tool/fixtures/models-api.json
        run: |
          bun run --cwd packages/cyberstrike build --single --skip-install
          test -x packages/cyberstrike/dist/cyberstrike-linux-x64/bin/cyberstrike
          test -s packages/cyberstrike/dist/hackbrowser-worker/hackbrowser-worker.js

  required:
    name: test (linux)
    runs-on: ubuntu-24.04
    needs:
      - unit
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"
