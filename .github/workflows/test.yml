name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@cyberstrike.io"
          git config --global user.name "cyberstrike"

      - name: Verify CLI help
        run: bun run --cwd packages/cyberstrike src/index.ts -h

      - name: Run learning isolation regression test
        run: bun run --cwd packages/cyberstrike test test/learning/learning-isolation.test.ts

      - name: Build CyberStrike for Linux
        env:
          MODELS_DEV_API_JSON: ./test/tool/fixtures/models-api.json
          CYBERSTRIKE_BUILD_OS: linux
        run: bun run --cwd packages/cyberstrike build --single --skip-install

      - name: Run focused CyberStrike scope workspace tests
        run: cd packages/cyberstrike && bun test --timeout 30000 test/tool/target-workspace.test.ts

      - name: Run unit tests
        run: bun turbo test

  required:
    name: test (linux)
    runs-on: ubuntu-24.04
    needs:
      - unit
    if: always()
    steps:
      - name: Verify upstream test jobs passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"
